# Decap CMS 설정: 관리자에서 편집 가능한 항목은 블로그(content/posts)와 FAQ(data/faq.json)뿐입니다.
# 병원 정보·의료진·갤러리(data/clinic.json)와 임상 케이스(content/cases)는 코드에서 직접 수정합니다.
backend:
  name: git-gateway
  branch: main
locale: ko
publish_mode: editorial_workflow
media_folder: assets/uploads
public_folder: /assets/uploads
site_url: https://yonseiacro-preview.netlify.app
slug:
  encoding: unicode
  clean_accents: false
collections:
- name: blog
  label: 블로그
  folder: content/posts
  create: true
  slug: '{{year}}{{month}}{{day}}-{{fields.title}}'
  summary: '{{date}} · {{tag}} · {{title}}'
  fields:
  - label: 제목
    name: title
    widget: string
  - label: 날짜
    name: date
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
  - label: 태그(치료분야)
    name: tag
    widget: select
    options:
    - 임플란트
    - 충치치료
    - 신경치료
    - 보철치료
    - 틀니
    - 잇몸치료
    - 사랑니 발치
    - 치아미백
    - 턱관절 치료
    - 소아치과
    - 교정·유지장치
    - 예방·검진
    - 병원 이야기
  - label: 요약(검색·AI 요약용 답변 1~2문장)
    name: summary
    widget: text
  - label: 대표 질문(선택)
    name: question
    widget: string
    required: false
  - label: 대표 이미지
    name: thumbnail
    widget: image
    required: false
  - label: 인기 게시물
    name: popular
    widget: boolean
    default: false
  - label: 작성자
    name: author
    widget: string
    default: 연세아크로치과
  - label: FAQ
    name: faq
    widget: list
    required: false
    fields:
    - label: 질문
      name: q
      widget: string
    - label: 답변
      name: a
      widget: text
  - label: 원문 URL
    name: source_url
    widget: string
    required: false
  - label: 본문
    name: body
    widget: markdown
- name: faq
  label: 자주 묻는 질문(FAQ)
  files:
  - label: 자주 묻는 질문(FAQ)
    name: faq
    file: data/faq.json
    format: json
    fields:
    - label: 분류
      name: groups
      widget: list
      summary: '{{fields.category}}'
      fields:
      - label: 분류명
        name: category
        widget: string
      - label: 질문 목록
        name: items
        widget: list
        summary: '{{fields.q}}'
        fields:
        - label: 질문
          name: q
          widget: string
        - label: 답변
          name: a
          widget: text
display_url: https://yonseiacro-preview.netlify.app
